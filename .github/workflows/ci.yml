name: Source checks
# Once per pull request update and per push to staging or main; any branch on
# demand. A newer push cancels the run it supersedes.
on:
  pull_request:
  push:
    branches: [main, staging]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    # One Linux job: billing rounds every job up to a whole minute.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPEN_XY_KIT: ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release source
        # Contributions go to staging; main takes a release PR, from staging or
        # from a release branch (release/<version>) cut from it, and catalog-only
        # changes, which maintainers then merge from main into staging.
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if { [ "$HEAD_REF" = staging ] || [[ "$HEAD_REF" == release/* ]]; } && [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
            exit 0
          fi
          changed=$(git diff --name-only origin/main...HEAD)
          if [ -z "$changed" ] || grep -vqxE 'catalog/(machines|extensions)\.json' <<<"$changed"; then
            echo "::error::Only catalog/machines.json and catalog/extensions.json changes and release merges (staging or release/<version>) go into main; open other pull requests against staging. Changed: $(echo $changed)"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Private-data guard
        run: |
          python tools/check_private_files.py --tree HEAD
          python tools/check_private_files.py --history
      - run: python -m pip install numpy==2.3.5
      - name: Source checks
        run: python sdk.py check
      - name: First machine
        timeout-minutes: 5
        # The first-machine walkthrough end to end: scaffold, C++/Wasm preview,
        # stale-source rejection and the documented audible edit. No firmware.
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y clang lld
          python tools/check_first_machine.py --cxx clang++
      - name: Web
        run: |
          npm ci
          npm run test:web
          npm run build
  windows:
    # Windows minutes bill double: release PRs, main and manual runs only.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install numpy==2.3.5
      - run: python sdk.py check
